<rd-menu-layout>
  <div menu-header class="top">
    <button
      rdButton
      variant="ghost"
      type="button"
      class="settings"
      [attr.aria-label]="'home.settings' | t"
      (click)="settingsOpen.set(true)"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path
          fill="currentColor"
          d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
          transform="translate(-1 0)"
        />
      </svg>
      {{ 'home.settings' | t }}
    </button>
  </div>

  <div class="hero">
    <h1 class="logo">
      <span class="rapid">Rapid</span>
      <span class="dash">Dash</span>
    </h1>
    <p class="tagline">{{ 'app.tagline' | t }}</p>
  </div>

  <div menu-footer class="bottom">
    <button rdButton type="button" [block]="true" class="start" (click)="start()">
      {{ 'home.start' | t }}
    </button>
    <p class="controls">{{ 'home.controls' | t }}</p>
  </div>
</rd-menu-layout>

@if (settingsOpen()) {
  <rd-settings-dialog
    [language]="i18n.language()"
    (languageChange)="setLanguage($event)"
    (closed)="settingsOpen.set(false)"
  />
}
