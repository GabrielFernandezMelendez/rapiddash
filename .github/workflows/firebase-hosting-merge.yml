# Generado por Firebase CLI y ajustado a mano: Node 24 y caché de npm
# https://github.com/firebase/firebase-tools

# Cada merge en main publica el juego en https://rapiddash-gabo.web.app
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAPIDDASH_GABO }}
          channelId: live
          projectId: rapiddash-gabo
